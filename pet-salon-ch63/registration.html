<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Pet Registration</title>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Pet Salon</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">About Us</a></li>
                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link active" href="registration.html">Registration</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Register a Pet</h2>

    <!-- Form -->
    <div class="row mb-4">
        <div class="col-md-6">
            <input id="txtName" class="form-control mb-2" type="text" placeholder="Pet Name">
            <input id="txtAge" class="form-control mb-2" type="number" placeholder="Age">
            <input id="txtBreed" class="form-control mb-2" type="text" placeholder="Breed">
            <input id="txtService" class="form-control mb-2" type="text" placeholder="Service">
            <button class="btn btn-primary w-100" onclick="registerPet()">Register Pet</button>
        </div>
    </div>

    <!-- Pet Table -->
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Breed</th>
                <th>Service</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody id="petTableBody"></tbody>
    </table>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Your JS -->
<script src="register.js"></script>

</body>
</html>
