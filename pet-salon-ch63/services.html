<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Services</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Pet Salon</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">About Us</a></li>
                <li class="nav-item"><a class="nav-link active" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link" href="registration.html">Registration</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h2>Register a New Service</h2>

    <div class="md-3">
        <input id="serviceName" class="form-control mb-2" type="text" placeholder="Service Name">
        <input id="servicePrice" class="form-control mb-2" type="number" placeholder="Price">
        <textarea id="serviceDesc" class="form-control mb-2" placeholder="Service Description"></textarea>
        <button class="btn btn-primary w-100" onclick="registerService()">Register Service</button>
    </div>

    <hr>

    <h3>Available Services</h3>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Service</th>
                <th>Price</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody id="serviceTableBody"></tbody>
    </table>
</div>  
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="scripts/script.js"></script>
    
</body>
</html>
