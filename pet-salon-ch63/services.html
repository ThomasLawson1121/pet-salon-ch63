<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">

    <title>Services — Tommys Pet Salon</title>
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Tommys Pet Salon</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">About Us</a></li>
                <li class="nav-item"><a class="nav-link active" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link" href="registration.html">Registration</a></li>
            </ul>
        </div>
    </div>
</nav>


<header class="page-header text-center py-5">
    <h1 class="fw-bold">Our Services</h1>
    <p class="text-muted">Add new grooming services and view available ones below.</p>
</header>


<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm p-4">
                <h4 class="text-center mb-3">Register a New Service</h4>

                <input id="serviceName" class="form-control mb-2" type="text" placeholder="Service Name">
                <input id="servicePrice" class="form-control mb-2" type="number" placeholder="Price">
                <textarea id="serviceDesc" class="form-control mb-2" placeholder="Service Description"></textarea>
                
                <div class="d-flex justify-content-between mt-3">
                    <button class="btn btn-success flex-fill me-2" onclick="registerService()">
                        Register Service
                    </button>
                    <button id="retrieveServiceBtn" class="btn btn-secondary flex-fill me-2">
                        Retrieve 
                    </button>
                    <button id="deleteServiceBtn" class="btn btn-danger flex-fill">
                        Delete 
                    </button>
                </div>
            </div>
        </div>
    </div>

    <hr class="my-5">


    <h3 class="text-center mb-3">Available Services</h3>

    <div class="table-responsive">
        <table class="table table-bordered table-striped shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Service</th>
                    <th>Price</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody id="serviceTableBody">
                </tbody>
        </table>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="scripts/script.js"></script>

</body>
</html>
